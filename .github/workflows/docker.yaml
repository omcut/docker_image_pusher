name: Docker Installer Download

on:
  workflow_dispatch:
  schedule:
    - cron: '00 23 * * *'

permissions:
  contents: write

jobs:
  download_installer:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download installers
      run: |
        set -e  # 遇到错误立即退出
        # 通用 Linux 安装脚本
        curl -f -o linux.sh "https://get.docker.com"
        # Windows（x86_64 / ARM64）
        curl -f -o docker_desktop_installer_windows_x86_64.exe "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe"
        curl -f -o docker_desktop_installer_windows_arm64.exe "https://desktop.docker.com/win/main/arm64/Docker%20Desktop%20Installer.exe"
        # macOS（ARM64 / x86_64）
        curl -f -o docker_desktop_installer_mac_arm64.dmg "https://desktop.docker.com/mac/main/arm64/Docker.dmg"
        curl -f -o docker_desktop_installer_mac_x86_64.dmg "https://desktop.docker.com/mac/main/amd64/Docker.dmg"
        # Linux（Debian/Ubuntu .deb 和 Fedora/RHEL .rpm）使用最新版通用链接
        curl -f -o docker_desktop_installer_linux_debian_x86_64.deb "https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb"
        curl -f -o docker_desktop_installer_linux_fedora_x86_64.rpm "https://desktop.docker.com/linux/main/amd64/docker-desktop-x86_64.rpm"

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          linux.sh
          docker_desktop_installer_windows_x86_64.exe
          docker_desktop_installer_windows_arm64.exe
          docker_desktop_installer_mac_arm64.dmg
          docker_desktop_installer_mac_x86_64.dmg
          docker_desktop_installer_linux_debian_x86_64.deb
          docker_desktop_installer_linux_fedora_x86_64.rpm
        tag_name: latest
        allow_updates: true
        overwrite: true
        delete_release: true   # 删除旧的 Release 再创建全新，避免残留
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
